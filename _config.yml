name: LSP Research Group
url: https://lsp-group-nus.github.io
baseurl: ''

exclude: [bibble, README.md, Makefile, screenshot.png]

# colorize code snippets with the pygments module
highlighter: pygments

# The path structure for blog posts.
permalink: /blog/:year/:month/:day/:title.html

# Sections on the "people" page.
roles:
  - key: faculty
    name: Faculty
  - key: collab
    name: Collaborators
  - key: staff
    name: Staff
  - key: postdoc
    name: Postdocs
  - key: phd
    name: PhD Candidates
  - key: master
    name: Master's Students
  - key: ugrad
    name: Undergraduate Students
  - key: alum
    name: Alumni
  - key: ugrad-alum
    name: Past Undergraduate Students

# Number of news stories on the front page.
front_page_news: 2

# Base pathname for links.
base: ''

# make pages for the _projects folder
collections:
  projects:
    output: true

# Navigation bar links.
navigation:
  - title: Home
    link: /
  - title: People
    link: /people.html
  - title: Research
    link: /research.html
  - title: Publications
    link: /publications.html
  - title: Code
    link: /code.html
